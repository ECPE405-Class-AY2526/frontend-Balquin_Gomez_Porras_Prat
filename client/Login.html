<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <style>
    body {
      background: linear-gradient(135deg, #FFDFB7 0%, #F5A43D 50%, #f44336 100%);
      margin: 0;
      padding: 0;
      font-family: Couture, TW Cen MT;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
      z-index: 1000;
      justify-content: space-between;
      align-items: center;
      padding: 20px 25px;
      background-color: white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      box-sizing: border-box;
    }

    .site-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 125px, 20px, 20px;
    }

    .tiles-item-inner {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      max-width: 350px;
      width: 100%;
    }

    .form-signin input {
      width: 93%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    .form-actions button {
      width: 100%;
      background-color: #f44336;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    .form-actions button:hover {
      background-color: #F5A43D;
    }
  </style>
</head>
<body>
  <div class="header">
    <a href="Homepage.html">
      <img src="images/LOGO_with_caption.png" alt="MASK" height="50">
    </a>
  </div>

  <main class="site-content">
    <section class="signin section">
      <div class="tiles-item">
        <div class="tiles-item-inner has-shadow">
          <form id="login-form" class="form-signin">
            <fieldset>
              <div class="form-group mb-16">
                <label for="email">E-mail</label>
                <input id="email" type="email" placeholder="E-Mail" required>
              </div>
              <div class="form-group mb-24">
                <label for="password">Password</label>
                <input id="password" type="password" placeholder="Password" required>
              </div>
                <div class="form-actions">
                  <a href="Homepage2.html" class="button button-primary button-block button-shadow">
                    <font face='TW Cen MT' size=5px>Log In</font>
                  </a>
                </div>
            </fieldset>
          </form>
        </div>
      </div>
    </section>
  </main>

  <script src="http://localhost:3001/scripts/login.js"></script>
</body>
</html>
